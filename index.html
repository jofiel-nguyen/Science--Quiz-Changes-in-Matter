<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Quiz: Changes in Matter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h1>Physical vs. Chemical Change</h1>
        <p>Look at the image below. What type of change is it?</p>
        
        <div class="image-frame">
            <img id="change-image" src="" alt="Loading image...">
        </div>

        <div class="button-group">
            <button onclick="checkAnswer('physical')">Physical Change</button>
            <button onclick="checkAnswer('chemical')">Chemical Change</button>
        </div>

        <p id="feedback"></p>
        <button id="next-btn" onclick="loadQuestion()" style="display:none;">Next Question →</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
